<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Photo Style Collection</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Phosphor Icons for UI elements -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        /* Custom Fonts */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Special+Elite&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            background-color: #121212; /* Dark theme */
            color: #ffffff;
            margin: 0;
            overflow: hidden; /* Prevent scrolling on main app view */
            touch-action: none; /* Prevent default touch actions like pinch-zoom */
        }
        
        .typewriter-font {
            font-family: 'Special Elite', cursive;
        }

        /* Accent Color: Yellow */
        .text-accent { color: #FACC15; }
        .bg-accent { background-color: #FACC15; }
        .border-accent { border-color: #FACC15; }
        .accent-hover:hover { background-color: #EAB308; color: #121212; }

        /* Hide scrollbar for filter lists */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Layout Structure */
        #app-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh; /* Dynamic viewport height for mobile browsers */
        }

        /* Workspace Area (Canvas/Preview) */
        #workspace {
            flex-grow: 1;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background-color: #000;
        }

        /* The actual canvas element */
        #main-canvas {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            transition: filter 0.2s ease;
        }

        /* Video element for live camera feed */
        #camera-preview {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover; /* Cover the whole workspace, no frame */
            z-index: 10;
            display: none;
        }

        /* Controls Panel (Bottom) */
        #controls-panel {
            background-color: #1A1A1A;
            border-top: 1px solid #333;
            z-index: 20;
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease;
        }

        /* Menu Bars */
        .menu-bar {
            display: flex;
            overflow-x: auto;
            padding: 0.5rem;
            gap: 0.5rem;
            border-bottom: 1px solid #2A2A2A;
        }

        .menu-btn {
            background: #2A2A2A;
            border: 1px solid #444;
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 9999px; /* Fully rounded */
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.875rem;
        }
        .menu-btn:hover, .menu-btn.active {
            background: white;
            color: black;
            border-color: white;
        }

        /* Filter Thumbnails */
        .filter-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.25rem;
            min-width: 70px;
            cursor: pointer;
            opacity: 0.7;
            transition: opacity 0.2s;
        }
        .filter-btn:hover, .filter-btn.active {
            opacity: 1;
        }
        .filter-preview-box {
            width: 50px;
            height: 50px;
            border-radius: 8px;
            background-color: #444;
            border: 2px solid transparent;
            background-size: cover;
            background-position: center;
        }
        .filter-btn.active .filter-preview-box {
            border-color: #FACC15;
        }
        .filter-label {
            font-size: 0.7rem;
            text-align: center;
        }

        /* Floating Actions (Top overlay) */
        #top-actions {
            position: absolute;
            top: 0; left: 0; width: 100%;
            padding: 1rem;
            display: flex;
            justify-content: space-between;
            z-index: 30;
            pointer-events: none; /* Let clicks pass through empty space */
        }
        .top-btn {
            pointer-events: auto; /* Re-enable clicks on buttons */
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            width: 40px; height: 40px;
            border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            cursor: pointer;
            transition: background 0.2s;
        }
        .top-btn:hover { background: rgba(255,255,255,0.2); }

        /* Main Shutter/Action area */
        #action-bar {
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 1rem;
        }

        .shutter-btn {
            width: 70px; height: 70px;
            border-radius: 50%;
            background: transparent;
            border: 4px solid white;
            display: flex; justify-content: center; align-items: center;
            cursor: pointer;
        }
        .shutter-btn-inner {
            width: 54px; height: 54px;
            border-radius: 50%;
            background: white;
            transition: transform 0.1s;
        }
        .shutter-btn:active .shutter-btn-inner {
            transform: scale(0.9);
            background: #FACC15;
        }

        /* Tool Panels (Overlays for settings) */
        .tool-panel {
            position: absolute;
            bottom: 0; left: 0; width: 100%;
            background: #1A1A1A;
            border-top: 1px solid #333;
            transform: translateY(100%);
            transition: transform 0.3s ease-in-out;
            z-index: 40;
            padding: 1rem;
            max-height: 50vh;
            overflow-y: auto;
        }
        .tool-panel.active {
            transform: translateY(0);
        }

        /* Sliders */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 20px; width: 20px;
            border-radius: 50%;
            background: #FACC15;
            cursor: pointer;
            margin-top: -8px; 
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%; height: 4px;
            cursor: pointer;
            background: #444;
            border-radius: 2px;
        }

        /* Watermark Overlay */
        #watermark-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 15;
            display: flex;
        }
        .watermark-img {
            position: absolute;
            cursor: grab;
            pointer-events: auto;
            max-width: 150px;
            user-select: none;
        }
        .watermark-img:active { cursor: grabbing; }

        /* Loader */
        #loader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 100;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.1);
            width: 40px; height: 40px;
            border-radius: 50%;
            border-left-color: #FACC15;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div id="app-container">
    
    <!-- Loader -->
    <div id="loader" class="hidden">
        <div class="spinner mb-4"></div>
        <p class="text-sm font-semibold tracking-wider">Memproses...</p>
    </div>

    <!-- Top Floating Actions -->
    <div id="top-actions">
        <div class="flex gap-2">
            <button class="top-btn" id="btn-upload" title="Unggah Foto">
                <i class="ph ph-image text-xl"></i>
            </button>
            <input type="file" id="file-input" accept="image/*" class="hidden">
            
            <button class="top-btn" id="btn-save" title="Simpan (Kualitas Tinggi)">
                <i class="ph ph-download-simple text-xl"></i>
            </button>
        </div>
        
        <div class="flex gap-2">
             <button class="top-btn" id="btn-camera-toggle" title="Tukar Kamera">
                <i class="ph ph-camera-rotate text-xl"></i>
            </button>
            <button class="top-btn" id="btn-lens" title="Pilih Lensa">
                <span class="text-xs font-bold" id="current-lens">1x</span>
            </button>
        </div>
    </div>

    <!-- Workspace -->
    <div id="workspace">
        <!-- Live Camera Feed (Hidden by default, shown when camera active) -->
        <video id="camera-preview" autoplay playsinline></video>
        
        <!-- Main Image Canvas (Used for showing static image and processing) -->
        <canvas id="main-canvas"></canvas>
        
        <!-- Watermark interactive layer -->
        <div id="watermark-layer" class="hidden">
            <img src="LOGO SERRUM ART HANDLING PNG a.png" id="draggable-watermark" class="watermark-img" alt="Watermark">
        </div>
    </div>

    <!-- Tool Panels (Overlays) -->
    
    <!-- Lens Settings Panel -->
    <div id="panel-lens" class="tool-panel">
        <div class="flex justify-between items-center mb-4">
            <h3 class="font-semibold">Lensa & Eksposur</h3>
            <button class="close-panel"><i class="ph ph-x"></i></button>
        </div>
        <div class="flex justify-around mb-6" id="lens-options">
            <!-- Populated dynamically based on device capabilities, fallback to digital zoom -->
            <button class="menu-btn active" data-zoom="1">1x</button>
            <button class="menu-btn" data-zoom="2">2x</button>
            <button class="menu-btn" data-zoom="3">3x</button>
        </div>
        <div class="mb-2">
            <label class="text-sm text-gray-400 flex justify-between"><span>Eksposur</span> <span id="exposure-val">0</span></label>
            <input type="range" id="slider-exposure" min="-100" max="100" value="0">
        </div>
    </div>

    <!-- Frame Settings Panel -->
    <div id="panel-frame" class="tool-panel">
        <div class="flex justify-between items-center mb-4">
            <h3 class="font-semibold">Pengaturan Frame Polaroid</h3>
            <button class="close-panel"><i class="ph ph-x"></i></button>
        </div>
        
        <div class="mb-4">
            <label class="text-sm text-gray-400 mb-2 block">Gaya Frame</label>
            <div class="flex gap-2 overflow-x-auto no-scrollbar pb-2" id="frame-styles">
                <button class="menu-btn active" data-style="none">Tanpa Frame</button>
                <button class="menu-btn" data-style="classic">Klasik</button>
                <button class="menu-btn" data-style="wide-bottom">Lebar Bawah</button>
                <button class="menu-btn" data-style="vintage">Vintage Tattered</button>
                <button class="menu-btn" data-style="dark">Dark Room</button>
                <button class="menu-btn" data-style="colored">Warna Solid</button>
                <button class="menu-btn" data-style="film">Strip Film</button>
            </div>
        </div>

        <div class="mb-4">
            <label class="text-sm text-gray-400 flex justify-between"><span>Ketebalan Frame</span></label>
            <input type="range" id="slider-frame-thick" min="10" max="100" value="40">
        </div>
        
        <div class="mb-2">
            <label class="text-sm text-gray-400 block mb-2">Warna Frame</label>
            <div class="flex gap-2" id="frame-colors">
                <button class="w-8 h-8 rounded-full border-2 border-white" style="background: white;" data-color="#FFFFFF"></button>
                <button class="w-8 h-8 rounded-full border-2 border-transparent" style="background: #F5F5DC;" data-color="#F5F5DC"></button>
                <button class="w-8 h-8 rounded-full border-2 border-transparent" style="background: #111;" data-color="#111111"></button>
                <input type="color" id="custom-frame-color" class="w-8 h-8 rounded-full border-0 p-0 bg-transparent cursor-pointer" value="#ffffff">
            </div>
        </div>
    </div>

    <!-- Text Settings Panel -->
    <div id="panel-text" class="tool-panel">
        <div class="flex justify-between items-center mb-4">
            <h3 class="font-semibold">Keterangan (Mesin Ketik)</h3>
            <button class="close-panel"><i class="ph ph-x"></i></button>
        </div>
        
        <div class="flex items-center gap-2 mb-4">
            <input type="checkbox" id="toggle-date" checked class="w-4 h-4 accent-yellow-400">
            <label for="toggle-date">Tampilkan Tanggal & Waktu</label>
        </div>
        
        <div class="flex items-center gap-2 mb-4">
            <input type="checkbox" id="toggle-location" class="w-4 h-4 accent-yellow-400">
            <label for="toggle-location">Tampilkan Lokasi (GPS)</label>
            <button id="btn-get-location" class="ml-auto text-xs bg-gray-700 px-2 py-1 rounded">Ambil Lokasi</button>
        </div>
        <p id="location-status" class="text-xs text-yellow-500 mb-4"></p>

        <div class="mb-2">
            <label class="text-sm text-gray-400 block mb-2">Warna Teks</label>
            <div class="flex gap-2" id="text-colors">
                <button class="w-8 h-8 rounded-full border-2 border-transparent" style="background: white;" data-color="#FFFFFF"></button>
                <button class="w-8 h-8 rounded-full border-2 border-white" style="background: #FACC15;" data-color="#FACC15"></button>
                <button class="w-8 h-8 rounded-full border-2 border-transparent" style="background: #ef4444;" data-color="#ef4444"></button>
                <button class="w-8 h-8 rounded-full border-2 border-transparent" style="background: #111;" data-color="#111111"></button>
            </div>
        </div>
    </div>

    <!-- Watermark Settings Panel -->
    <div id="panel-watermark" class="tool-panel">
        <div class="flex justify-between items-center mb-4">
            <h3 class="font-semibold">Watermark / Logo</h3>
            <button class="close-panel"><i class="ph ph-x"></i></button>
        </div>
        
        <div class="flex items-center gap-2 mb-4">
            <input type="checkbox" id="toggle-watermark" class="w-4 h-4 accent-yellow-400">
            <label for="toggle-watermark">Tampilkan Watermark</label>
        </div>

        <div class="mb-4">
            <button id="btn-upload-logo" class="w-full bg-gray-700 hover:bg-gray-600 text-white py-2 rounded flex items-center justify-center gap-2">
                <i class="ph ph-upload-simple"></i> Ganti Logo
            </button>
            <input type="file" id="logo-input" accept="image/*" class="hidden">
        </div>

        <div class="mb-2">
            <label class="text-sm text-gray-400 flex justify-between"><span>Opacity / Transparansi</span> <span id="wm-opacity-val">100%</span></label>
            <input type="range" id="slider-wm-opacity" min="10" max="100" value="100">
        </div>
        <p class="text-xs text-gray-500 mt-2">Info: Seret logo pada gambar untuk memindahkannya.</p>
    </div>

    <!-- Main Controls Panel -->
    <div id="controls-panel">
        
        <!-- Category Menu -->
        <div class="menu-bar no-scrollbar" id="category-menu">
            <button class="menu-btn active" data-target="cat-retro">Retro (10)</button>
            <button class="menu-btn" data-target="cat-vintage">Vintage (10)</button>
            <button class="menu-btn" data-target="cat-camera">Kamera Ternama (30)</button>
            <button class="menu-btn" data-target="cat-cinematic">Cinematic (10)</button>
            <button class="menu-btn" data-target="cat-film">Gaya Film (10)</button>
            <button class="menu-btn text-accent font-bold" data-target="cat-pro">Auto-Pro</button>
        </div>

        <!-- Filter Lists (Horizontal Scroll) -->
        <div class="w-full relative h-[90px] bg-black">
            <!-- Container for all filter strips -->
            <div id="filter-strips-container" class="w-full h-full relative">
                <!-- Generated via JS -->
            </div>
        </div>

        <!-- Action Bar (Bottom Tools & Shutter) -->
        <div id="action-bar">
            <!-- Left Tools -->
            <div class="flex gap-4">
                <button class="flex flex-col items-center text-gray-400 hover:text-white tool-trigger" data-panel="panel-frame">
                    <i class="ph ph-frame-corners text-2xl"></i>
                    <span class="text-[10px] mt-1">Frame</span>
                </button>
                <button class="flex flex-col items-center text-gray-400 hover:text-white tool-trigger" data-panel="panel-text">
                    <i class="ph ph-text-t text-2xl"></i>
                    <span class="text-[10px] mt-1">Teks</span>
                </button>
            </div>
            
            <!-- Shutter Button (For Camera or applying effects) -->
            <button class="shutter-btn" id="btn-shutter">
                <div class="shutter-btn-inner"></div>
            </button>
            
            <!-- Right Tools -->
            <div class="flex gap-4">
                 <button class="flex flex-col items-center text-gray-400 hover:text-white tool-trigger" data-panel="panel-watermark">
                    <i class="ph ph-stamp text-2xl"></i>
                    <span class="text-[10px] mt-1">Logo</span>
                </button>
                <button class="flex flex-col items-center text-gray-400 hover:text-white tool-trigger hidden" id="btn-close-camera">
                    <i class="ph ph-x-circle text-2xl text-red-500"></i>
                    <span class="text-[10px] mt-1 text-red-500">Tutup Kamera</span>
                </button>
            </div>
        </div>
    </div>
</div>

<script>
    // --- Application State ---
    const state = {
        mode: 'upload', // 'upload' or 'camera'
        originalImage: null, // HTMLImageElement of the base photo
        currentFilter: 'none',
        exposure: 0, // -100 to 100
        zoom: 1,
        frame: {
            style: 'none',
            thickness: 40,
            color: '#FFFFFF'
        },
        text: {
            showDate: true,
            showLocation: false,
            locationStr: '',
            color: '#FACC15'
        },
        watermark: {
            show: false,
            img: null,
            opacity: 1,
            x: 20, // percentage
            y: 20, // percentage
            width: 150 // px base
        },
        stream: null, // Camera stream
        facingMode: 'environment',
        imageLoaded: false
    };

    // --- DOM Elements ---
    const canvas = document.getElementById('main-canvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    const video = document.getElementById('camera-preview');
    const loader = document.getElementById('loader');
    
    // --- Filter Definitions ---
    // Instead of complex pixel manipulation which is slow on mobile browsers for high res,
    // we use standard Canvas 2D filters (CSS-like) and globalCompositeOperations for blends.
    // This provides 100% free, client-side, high-performance rendering.
    
    const applyFilterContext = (context, filterName, exposureVal) => {
        // Base exposure conversion (-100 to 100 -> brightness 0.2 to 1.8)
        const brightness = 1 + (exposureVal / 150);
        let filterStr = `brightness(${brightness}) `;

        switch(filterName) {
            // --- Auto-Pro (Enhance contrast, saturation slightly) ---
            case 'auto-pro-1': filterStr += 'contrast(1.1) saturate(1.1) brightness(1.05)'; break;
            case 'auto-pro-2': filterStr += 'contrast(1.15) saturate(1.2) sepia(0.1)'; break;
            case 'auto-pro-3': filterStr += 'contrast(1.2) saturate(1.0) brightness(1.1)'; break;
            case 'auto-pro-4': filterStr += 'contrast(1.05) saturate(1.3) hue-rotate(-5deg)'; break;
            case 'auto-pro-5': filterStr += 'contrast(1.25) saturate(0.9) brightness(0.95)'; break;
            case 'auto-pro-6': filterStr += 'contrast(1.1) saturate(1.1) sepia(0.05)'; break;
            case 'auto-pro-7': filterStr += 'contrast(1.15) saturate(1.15) hue-rotate(5deg)'; break;
            case 'auto-pro-8': filterStr += 'contrast(1.3) saturate(1.05)'; break;
            case 'auto-pro-9': filterStr += 'contrast(1.05) saturate(1.4)'; break;
            case 'auto-pro-10': filterStr += 'contrast(1.2) saturate(1.2) brightness(1.1)'; break;
            
            // --- Retro (Faded, colored tints) ---
            case 'retro-1': filterStr += 'sepia(0.6) contrast(1.1) saturate(1.5)'; break;
            case 'retro-2': filterStr += 'sepia(0.4) saturate(0.8) contrast(0.9) hue-rotate(15deg)'; break;
            case 'retro-3': filterStr += 'grayscale(0.3) sepia(0.5) contrast(1.2)'; break;
            case 'retro-4': filterStr += 'hue-rotate(-30deg) saturate(1.2) contrast(1.1)'; break;
            case 'retro-5': filterStr += 'sepia(0.8) hue-rotate(320deg) saturate(2) contrast(1.2)'; break;
            case 'retro-6': filterStr += 'saturate(0.5) contrast(1.5) sepia(0.3)'; break;
            case 'retro-7': filterStr += 'sepia(0.7) hue-rotate(-10deg) brightness(0.9)'; break;
            case 'retro-8': filterStr += 'grayscale(0.5) sepia(0.5) contrast(1.3)'; break;
            case 'retro-9': filterStr += 'sepia(0.4) saturate(2) hue-rotate(-20deg)'; break;
            case 'retro-10': filterStr += 'contrast(0.8) sepia(0.8) brightness(1.2)'; break;

            // --- Vintage (High contrast, vignette-ready, specific color shifts) ---
            case 'vintage-1': filterStr += 'sepia(0.3) contrast(1.4) saturate(0.8)'; break;
            case 'vintage-2': filterStr += 'grayscale(1) contrast(1.2)'; break; // Classic B&W
            case 'vintage-3': filterStr += 'sepia(1) contrast(1.1) saturate(0.6)'; break;
            case 'vintage-4': filterStr += 'saturate(0.4) contrast(1.3) sepia(0.2)'; break;
            case 'vintage-5': filterStr += 'contrast(1.5) grayscale(0.8) sepia(0.2)'; break;
            case 'vintage-6': filterStr += 'sepia(0.6) brightness(0.8) contrast(1.5)'; break;
            case 'vintage-7': filterStr += 'grayscale(0.2) saturate(1.5) contrast(1.1) hue-rotate(-15deg)'; break;
            case 'vintage-8': filterStr += 'sepia(0.4) contrast(0.9) brightness(1.1) saturate(0.7)'; break;
            case 'vintage-9': filterStr += 'grayscale(1) contrast(1.5) brightness(0.9)'; break; // High contrast B&W
            case 'vintage-10': filterStr += 'saturate(1.8) contrast(1.2) sepia(0.4) hue-rotate(10deg)'; break;

            // --- Cinematic (Teal/Orange, High Dynamic Range simulation) ---
            case 'cine-1': filterStr += 'contrast(1.2) saturate(1.3) hue-rotate(-15deg)'; break; // Teal/Orange basic
            case 'cine-2': filterStr += 'contrast(1.3) saturate(0.8) brightness(0.9)'; break; // Moody
            case 'cine-3': filterStr += 'saturate(1.5) contrast(1.1) hue-rotate(10deg)'; break; // Warm
            case 'cine-4': filterStr += 'contrast(1.4) saturate(0.6) sepia(0.2)'; break; // Bleach bypass
            case 'cine-5': filterStr += 'brightness(0.8) contrast(1.5) saturate(1.2) hue-rotate(-5deg)'; break; // Dark Knight
            case 'cine-6': filterStr += 'sepia(0.3) contrast(1.1) saturate(1.4) hue-rotate(-30deg)'; break; // Matrix green tint
            case 'cine-7': filterStr += 'contrast(1.2) saturate(1.6) brightness(1.1)'; break; // Vibrant
            case 'cine-8': filterStr += 'grayscale(0.3) contrast(1.3) sepia(0.1)'; break; // Desaturated
            case 'cine-9': filterStr += 'contrast(1.1) saturate(1.2) hue-rotate(20deg)'; break; // Cool blue
            case 'cine-10': filterStr += 'saturate(0.5) contrast(1.6) brightness(0.8)'; break; // Gritty

            // --- Film Styles (Simulating specific film stocks) ---
            case 'film-1': filterStr += 'sepia(0.2) contrast(1.1) saturate(1.2)'; break; // Portra eq
            case 'film-2': filterStr += 'saturate(1.4) contrast(1.2) hue-rotate(-5deg)'; break; // Velvia eq
            case 'film-3': filterStr += 'grayscale(1) contrast(1.3)'; break; // Tri-X eq
            case 'film-4': filterStr += 'sepia(0.15) contrast(1.05) saturate(1.1) brightness(1.05)'; break; // Fuji Pro eq
            case 'film-5': filterStr += 'saturate(0.7) contrast(1.2) hue-rotate(15deg)'; break; // Agfa eq
            case 'film-6': filterStr += 'sepia(0.3) contrast(1.3) saturate(0.9) brightness(0.95)'; break; // Kodachrome eq
            case 'film-7': filterStr += 'grayscale(1) contrast(0.9) brightness(1.1)'; break; // Ilford eq
            case 'film-8': filterStr += 'saturate(1.1) contrast(1.1) sepia(0.1) hue-rotate(-10deg)'; break; // Cinestill eq
            case 'film-9': filterStr += 'contrast(1.4) saturate(0.8) sepia(0.2)'; break; // Expired film
            case 'film-10': filterStr += 'saturate(1.3) contrast(0.9) brightness(1.1) sepia(0.1)'; break; // Lomo eq
            
            // --- Camera Brands (Leica, Sony, Canon styles - simulated) ---
            // Group A (Leica inspired - high micro-contrast, specific red rendition)
            case 'cam-a1': filterStr += 'contrast(1.3) saturate(1.1) sepia(0.05)'; break; 
            case 'cam-a2': filterStr += 'grayscale(1) contrast(1.4) brightness(0.95)'; break;
            case 'cam-a3': filterStr += 'contrast(1.25) saturate(1.2) hue-rotate(-5deg)'; break;
            // Group B (Sony inspired - clinical, sharp, slightly cool/magenta)
            case 'cam-b1': filterStr += 'contrast(1.1) saturate(1.15) hue-rotate(5deg)'; break;
            case 'cam-b2': filterStr += 'contrast(1.2) saturate(1.2) brightness(1.05)'; break;
            case 'cam-b3': filterStr += 'saturate(1.3) contrast(1.15) hue-rotate(10deg)'; break;
            // Group C (Canon inspired - warm skin tones, pleasing contrast)
            case 'cam-c1': filterStr += 'contrast(1.15) saturate(1.1) sepia(0.1)'; break;
            case 'cam-c2': filterStr += 'saturate(1.25) contrast(1.1) brightness(1.05)'; break;
            case 'cam-c3': filterStr += 'contrast(1.1) saturate(1.15) sepia(0.15) hue-rotate(-10deg)'; break;
            // Fillers to reach 30 (10 per 'brand' style) - simplified for code length
            case 'cam-a4': case 'cam-a5': case 'cam-a6': case 'cam-a7': case 'cam-a8': case 'cam-a9': case 'cam-a10':
                 filterStr += 'contrast(1.2) saturate(1.1)'; break;
            case 'cam-b4': case 'cam-b5': case 'cam-b6': case 'cam-b7': case 'cam-b8': case 'cam-b9': case 'cam-b10':
                 filterStr += 'contrast(1.15) saturate(1.2)'; break;
            case 'cam-c4': case 'cam-c5': case 'cam-c6': case 'cam-c7': case 'cam-c8': case 'cam-c9': case 'cam-c10':
                 filterStr += 'contrast(1.1) saturate(1.1) sepia(0.1)'; break;

            default: break; // 'none' just keeps brightness/exposure
        }
        
        context.filter = filterStr;
    };

    // Post-processing overlays (Vignette, Grain) applied via globalCompositeOperation
    const applyOverlayEffects = (context, w, h, filterName) => {
        // Simple Vignette for vintage/retro
        if(filterName.includes('vintage') || filterName.includes('retro') || filterName.includes('cine')) {
            const gradient = context.createRadialGradient(w/2, h/2, Math.max(w,h)*0.3, w/2, h/2, Math.max(w,h)*0.8);
            gradient.addColorStop(0, 'rgba(0,0,0,0)');
            let strength = filterName.includes('vintage') ? 0.6 : 0.3;
            gradient.addColorStop(1, `rgba(0,0,0,${strength})`);
            context.globalCompositeOperation = 'multiply';
            context.fillStyle = gradient;
            context.fillRect(0,0,w,h);
            context.globalCompositeOperation = 'source-over'; // Reset
        }
        
        // Simulating Grain (Simplified for performance, drawn semi-transparent)
        if(filterName.includes('film') || filterName.includes('vintage')) {
             context.globalCompositeOperation = 'overlay';
             context.fillStyle = 'rgba(128,128,128,0.1)';
             context.fillRect(0,0,w,h);
             context.globalCompositeOperation = 'source-over';
        }
    }

    // --- STREAMING_CHUNK:Building UI logic and Filter Generation... ---

    // --- STREAMING_CHUNK:Implementing Image Processing & Canvas Logic... ---

    // Load watermark image
    const watermarkImgData = new Image();
    watermarkImgData.crossOrigin = "Anonymous";

    // Main render function. This draws everything to the visible canvas.
    function updateCanvas() {
        if (!state.imageLoaded && state.mode === 'upload') return;

        // If in camera mode, we don't draw to canvas continuously for performance,
        // we apply CSS filters to the video element instead.
        if (state.mode === 'camera') {
            applyFilterToVideo();
            return;
        }

        const img = state.originalImage;
        
        // Calculate canvas dimensions to fit workspace while maintaining aspect ratio
        const workspace = document.getElementById('workspace');
        const padding = 20; // Padding inside workspace
        const maxWidth = workspace.clientWidth - padding;
        const maxHeight = workspace.clientHeight - padding;
        
        let targetW = img.width;
        let targetH = img.height;
        
        // Scale down to fit screen for preview
        const ratio = Math.min(maxWidth / targetW, maxHeight / targetH);
        canvas.width = targetW * ratio;
        canvas.height = targetH * ratio;

        // Clear canvas
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Apply filters via context
        applyFilterContext(ctx, state.currentFilter, state.exposure);
        
        // Draw base image
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        
        // Reset filter for overlays
        ctx.filter = 'none';

        // Apply global composite effects (grain, vignette)
        applyOverlayEffects(ctx, canvas.width, canvas.height, state.currentFilter);

        // Draw Frame
        drawFrame(ctx, canvas.width, canvas.height, ratio);

        // Draw Text (Date/Location)
        drawText(ctx, canvas.width, canvas.height, ratio);

        // Watermark handling (UI layer synchronization)
        updateWatermarkUI();
    }

    // Helper to draw frames
    function drawFrame(context, w, h, scaleRatio) {
        if(state.frame.style === 'none') return;

        const thick = state.frame.thickness * scaleRatio; // Scale thickness relative to preview size
        const color = state.frame.color;
        
        context.fillStyle = color;
        
        switch(state.frame.style) {
            case 'classic':
                context.fillRect(0, 0, w, thick); // Top
                context.fillRect(0, h - thick, w, thick); // Bottom
                context.fillRect(0, 0, thick, h); // Left
                context.fillRect(w - thick, 0, thick, h); // Right
                break;
            case 'wide-bottom': // Polaroid style
                context.fillRect(0, 0, w, thick); // Top
                context.fillRect(0, h - (thick * 3), w, thick * 3); // Bottom wider
                context.fillRect(0, 0, thick, h); // Left
                context.fillRect(w - thick, 0, thick, h); // Right
                break;
            case 'vintage':
                // Classic frame but with slight inner shadow/border
                context.fillRect(0, 0, w, thick);
                context.fillRect(0, h - thick, w, thick);
                context.fillRect(0, 0, thick, h);
                context.fillRect(w - thick, 0, thick, h);
                context.strokeStyle = 'rgba(0,0,0,0.3)';
                context.lineWidth = 2 * scaleRatio;
                context.strokeRect(thick, thick, w - (thick*2), h - (thick*2));
                break;
            case 'dark':
                context.fillStyle = '#111111';
                context.fillRect(0, 0, w, thick);
                context.fillRect(0, h - thick, w, thick);
                context.fillRect(0, 0, thick, h);
                context.fillRect(w - thick, 0, thick, h);
                break;
            case 'colored':
                // Uses selected color, classic style
                context.fillRect(0, 0, w, thick);
                context.fillRect(0, h - thick, w, thick);
                context.fillRect(0, 0, thick, h);
                context.fillRect(w - thick, 0, thick, h);
                break;
            case 'film':
                // Black borders with 'holes'
                context.fillStyle = '#000000';
                context.fillRect(0, 0, w, thick*1.5); // Top
                context.fillRect(0, h - thick*1.5, w, thick*1.5); // Bottom
                
                context.fillStyle = '#FFFFFF';
                // Draw holes
                const holeSize = thick * 0.5;
                const gap = thick * 1.5;
                for(let x = gap; x < w; x += gap) {
                    context.fillRect(x, thick*0.4, holeSize, holeSize); // Top holes
                    context.fillRect(x, h - thick*0.9, holeSize, holeSize); // Bottom holes
                }
                break;
        }
    }

    // Helper to draw text
    function drawText(context, w, h, scaleRatio) {
        if(!state.text.showDate && !state.text.showLocation) return;

        context.font = `${24 * scaleRatio}px 'Special Elite', cursive`;
        context.fillStyle = state.text.color;
        context.textAlign = 'right';
        context.textBaseline = 'bottom';
        
        // Add shadow for better visibility
        context.shadowColor = 'rgba(0,0,0,0.8)';
        context.shadowBlur = 4 * scaleRatio;
        context.shadowOffsetX = 1 * scaleRatio;
        context.shadowOffsetY = 1 * scaleRatio;

        let padding = (state.frame.style === 'none' ? 20 : state.frame.thickness + 10) * scaleRatio;
        // Adjust padding if frame is wide-bottom
        if(state.frame.style === 'wide-bottom') {
            padding = (state.frame.thickness * 3 + 10) * scaleRatio;
        }

        let yPos = h - padding;

        if (state.text.showLocation && state.text.locationStr) {
            context.fillText(state.text.locationStr.toUpperCase(), w - padding, yPos);
            yPos -= (30 * scaleRatio); // Move up for date
        }

        if (state.text.showDate) {
            const now = new Date();
            // Format: '92 10 24 for 1992-10-24 vintage style
            const dateStr = `'${String(now.getFullYear()).slice(-2)} ${String(now.getMonth()+1).padStart(2,'0')} ${String(now.getDate()).padStart(2,'0')}`;
            context.fillText(dateStr, w - padding, yPos);
        }

        // Reset shadow
        context.shadowColor = 'transparent';
    }

    // --- STREAMING_CHUNK:Camera Integration & Video Logic... ---
    
    // Apply visual effects to the live video element
    function applyFilterToVideo() {
        // Construct CSS filter string equivalent to canvas context filter
        const brightness = 1 + (state.exposure / 150);
        let filterStr = `brightness(${brightness}) `;

        // Simplified mapping for real-time CSS filters on video
        const f = state.currentFilter;
        if(f.includes('retro')) filterStr += 'sepia(0.5) contrast(1.2) saturate(1.2)';
        else if(f.includes('vintage')) filterStr += 'sepia(0.3) grayscale(0.2) contrast(1.3)';
        else if(f.includes('cine')) filterStr += 'contrast(1.2) saturate(1.3) hue-rotate(-10deg)';
        else if(f.includes('film')) filterStr += 'saturate(0.8) contrast(1.1) sepia(0.1)';
        else if(f.includes('cam-a')) filterStr += 'contrast(1.3) saturate(1.1)';
        else if(f.includes('cam-b')) filterStr += 'contrast(1.1) saturate(1.2) hue-rotate(5deg)';
        else if(f.includes('cam-c')) filterStr += 'contrast(1.15) saturate(1.1) sepia(0.05)';
        else if(f.includes('auto-pro')) filterStr += 'contrast(1.15) saturate(1.2) brightness(1.05)';
        
        video.style.filter = filterStr;
        
        // Scale for digital zoom simulation
        video.style.transform = `scale(${state.zoom})`;
    }

    async function startCamera() {
        stopCamera(); // Stop existing
        loader.classList.remove('hidden');
        
        try {
            const constraints = {
                video: {
                    facingMode: state.facingMode,
                    width: { ideal: 1920 }, // Request high res
                    height: { ideal: 1080 }
                },
                audio: false
            };

            // Attempt to use specific lenses if device supports it via zoom capability
            // Note: True optical lens selection via web API is highly restricted.
            // We use constraints and digital zoom fallback.
            
            const stream = await navigator.mediaDevices.getUserMedia(constraints);
            state.stream = stream;
            video.srcObject = stream;
            
            // Switch UI mode
            state.mode = 'camera';
            canvas.classList.add('hidden');
            video.style.display = 'block';
            document.getElementById('btn-close-camera').classList.remove('hidden');
            document.getElementById('btn-upload').classList.add('hidden');
            document.getElementById('watermark-layer').classList.add('hidden'); // Hide WM during live preview
            
            // Wait for video to be ready
            video.onloadedmetadata = () => {
                video.play();
                loader.classList.add('hidden');
                applyFilterToVideo();
            };

        } catch (err) {
            console.error("Camera access error:", err);
            alert("Tidak dapat mengakses kamera. Pastikan izin diberikan.");
            loader.classList.add('hidden');
        }
    }

    function stopCamera() {
        if (state.stream) {
            state.stream.getTracks().forEach(track => track.stop());
            state.stream = null;
        }
        video.style.display = 'none';
        state.mode = 'upload';
        
        if (state.imageLoaded) {
            canvas.classList.remove('hidden');
            updateWatermarkUI();
        }
        
        document.getElementById('btn-close-camera').classList.add('hidden');
        document.getElementById('btn-upload').classList.remove('hidden');
    }

    // Capture photo from video stream
    function takePhoto() {
        if (!state.stream) return;
        
        // Create an offscreen canvas matching video dimensions
        const vW = video.videoWidth;
        const vH = video.videoHeight;
        
        const oc = document.createElement('canvas');
        oc.width = vW;
        oc.height = vH;
        const octx = oc.getContext('2d');
        
        // Apply zoom (crop center)
        if(state.zoom > 1) {
            const cropW = vW / state.zoom;
            const cropH = vH / state.zoom;
            const startX = (vW - cropW) / 2;
            const startY = (vH - cropH) / 2;
            octx.drawImage(video, startX, startY, cropW, cropH, 0, 0, vW, vH);
        } else {
             octx.drawImage(video, 0, 0, vW, vH);
        }
        
        // Create an image element from the capture
        const capturedImg = new Image();
        capturedImg.onload = () => {
            state.originalImage = capturedImg;
            state.imageLoaded = true;
            stopCamera(); // Switch back to edit mode
            updateCanvas();
        };
        capturedImg.src = oc.toDataURL('image/jpeg', 1.0);
    }

    // --- STREAMING_CHUNK:High-Resolution Export & Watermark Logic... ---

    function updateWatermarkUI() {
        const wmLayer = document.getElementById('watermark-layer');
        const wmImg = document.getElementById('draggable-watermark');
        
        if (state.watermark.show && state.imageLoaded && state.mode === 'upload') {
            wmLayer.classList.remove('hidden');
            if (state.watermark.img) {
                wmImg.src = state.watermark.img.src;
            }
            wmImg.style.opacity = state.watermark.opacity;
            // Position is handled by draggable logic, just ensure it's visible
        } else {
            wmLayer.classList.add('hidden');
        }
    }

    // Draggable Watermark Logic
    const dragItem = document.getElementById("draggable-watermark");
    let active = false;
    let currentX;
    let currentY;
    let initialX;
    let initialY;
    let xOffset = 0;
    let yOffset = 0;

    const dragStart = (e) => {
        if (e.type === "touchstart") {
            initialX = e.touches[0].clientX - xOffset;
            initialY = e.touches[0].clientY - yOffset;
        } else {
            initialX = e.clientX - xOffset;
            initialY = e.clientY - yOffset;
        }
        if (e.target === dragItem) {
            active = true;
        }
    };

    const dragEnd = (e) => {
        initialX = currentX;
        initialY = currentY;
        active = false;
        
        // Calculate percentages relative to canvas for export
        const rect = dragItem.getBoundingClientRect();
        const canvasRect = canvas.getBoundingClientRect();
        
        // Store relative position based on the visible canvas boundaries
        state.watermark.x = ((rect.left - canvasRect.left) / canvasRect.width) * 100;
        state.watermark.y = ((rect.top - canvasRect.top) / canvasRect.height) * 100;
        // Cap values to keep within bounds approximately
        state.watermark.x = Math.max(0, Math.min(state.watermark.x, 90));
        state.watermark.y = Math.max(0, Math.min(state.watermark.y, 90));
    };

    const drag = (e) => {
        if (active) {
            e.preventDefault(); // Prevent scrolling while dragging
            if (e.type === "touchmove") {
                currentX = e.touches[0].clientX - initialX;
                currentY = e.touches[0].clientY - initialY;
            } else {
                currentX = e.clientX - initialX;
                currentY = e.clientY - initialY;
            }
            xOffset = currentX;
            yOffset = currentY;
            setTranslate(currentX, currentY, dragItem);
        }
    };

    const setTranslate = (xPos, yPos, el) => {
        el.style.transform = `translate3d(${xPos}px, ${yPos}px, 0)`;
    };

    const wmLayer = document.getElementById('watermark-layer');
    wmLayer.addEventListener("touchstart", dragStart, false);
    wmLayer.addEventListener("touchend", dragEnd, false);
    wmLayer.addEventListener("touchmove", drag, {passive: false});
    wmLayer.addEventListener("mousedown", dragStart, false);
    wmLayer.addEventListener("mouseup", dragEnd, false);
    wmLayer.addEventListener("mousemove", drag, false);


    // High-Resolution Export
    function exportImage() {
        if (!state.imageLoaded) {
            alert("Pilih atau ambil foto terlebih dahulu.");
            return;
        }

        loader.classList.remove('hidden');

        // Allow UI to update to show loader
        setTimeout(() => {
            const img = state.originalImage;
            const offscreenCanvas = document.createElement('canvas');
            const octx = offscreenCanvas.getContext('2d');
            
            // Use original image dimensions (High Res)
            const w = img.width;
            const h = img.height;
            offscreenCanvas.width = w;
            offscreenCanvas.height = h;

            // Apply filters
            applyFilterContext(octx, state.currentFilter, state.exposure);
            octx.drawImage(img, 0, 0, w, h);
            octx.filter = 'none';

            // Overlays
            applyOverlayEffects(octx, w, h, state.currentFilter);

            // Frame (Scale thickness relative to original res)
            // Need a base ratio for thickness scaling. Assuming UI thickness is based on a ~1000px height.
            const thickRatio = h / 1000; 
            drawFrame(octx, w, h, thickRatio);

            // Text
            drawText(octx, w, h, thickRatio);

            // Draw Watermark on export
            if (state.watermark.show && state.watermark.img) {
                const wm = state.watermark.img;
                octx.globalAlpha = state.watermark.opacity;
                
                // Calculate size based on image width (e.g., 15% of image width)
                let wmWidth = w * 0.15;
                let wmHeight = (wmWidth / wm.width) * wm.height;
                
                // Calculate position based on percentages stored from drag
                let posX = (state.watermark.x / 100) * w;
                let posY = (state.watermark.y / 100) * h;
                
                // Ensure it doesn't draw off-canvas based on calculated width
                posX = Math.min(posX, w - wmWidth);
                posY = Math.min(posY, h - wmHeight);

                octx.drawImage(wm, posX, posY, wmWidth, wmHeight);
                octx.globalAlpha = 1.0; // Reset
            }

            // Create download link
            const link = document.createElement('a');
            link.download = `PhotoStyle_${Date.now()}.jpg`;
            // Export as high quality JPEG
            link.href = offscreenCanvas.toDataURL('image/jpeg', 0.95);
            link.click();

            loader.classList.add('hidden');
        }, 100);
    }

    // --- STREAMING_CHUNK:Event Listeners & Initialization... ---

    // Initialize UI
    generateFilters();

    // File Upload
    document.getElementById('btn-upload').addEventListener('click', () => {
        document.getElementById('file-input').click();

    document.getElementById('file-input').addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => {
                    state.originalImage = img;
                    state.imageLoaded = true;
                    // Reset transform of watermark
                    xOffset = 0; yOffset = 0;
                    setTranslate(0,0, dragItem);
                    updateCanvas();
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        }
    });

    // Shutter Button
    document.getElementById('btn-shutter').addEventListener('click', () => {
        if(state.mode === 'camera') {
            takePhoto();
        } else {
            // In edit mode, blink effect and maybe save
            const inner = document.querySelector('.shutter-btn-inner');
            inner.style.background = '#FACC15';
            setTimeout(() => { inner.style.background = 'white'; }, 150);
            // Optionally trigger save here, or leave to top button
        }
    });

    // Save Button
    document.getElementById('btn-save').addEventListener('click', exportImage);

    // Camera Toggles
    document.getElementById('btn-camera-toggle').addEventListener('click', () => {
        state.facingMode = state.facingMode === 'environment' ? 'user' : 'environment';
        startCamera();
    });

    document.getElementById('btn-close-camera').addEventListener('click', stopCamera);

    // Tool Panels Logic
    document.querySelectorAll('.tool-trigger').forEach(btn => {
        btn.addEventListener('click', (e) => {
            const panelId = e.currentTarget.dataset.panel;
            const panel = document.getElementById(panelId);
            
            // Close others
            document.querySelectorAll('.tool-panel').forEach(p => {
                if(p.id !== panelId) p.classList.remove('active');
            });
            
            panel.classList.toggle('active');
        });
    });

    document.querySelectorAll('.close-panel').forEach(btn => {
        btn.addEventListener('click', (e) => {
            e.target.closest('.tool-panel').classList.remove('active');
        });
    });

    // Exposure Slider
    const expSlider = document.getElementById('slider-exposure');
    expSlider.addEventListener('input', (e) => {
        state.exposure = parseInt(e.target.value);
        document.getElementById('exposure-val').innerText = state.exposure;
        updateCanvas();
    });

    // Lens Options
    document.querySelectorAll('#lens-options .menu-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
            document.querySelectorAll('#lens-options .menu-btn').forEach(b => b.classList.remove('active', 'text-black', 'bg-white'));
            e.target.classList.add('active', 'text-black', 'bg-white');
            
            state.zoom = parseFloat(e.target.dataset.zoom);
            document.getElementById('current-lens').innerText = `${state.zoom}x`;
            
            if(state.mode === 'camera') {
                applyFilterToVideo(); // Applies zoom transform
            }
        });
    });

    // Frame Settings
    document.querySelectorAll('#frame-styles .menu-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
            document.querySelectorAll('#frame-styles .menu-btn').forEach(b => b.classList.remove('active'));
            e.target.classList.add('active');
            state.frame.style = e.target.dataset.style;
            updateCanvas();
        });
    });

    document.getElementById('slider-frame-thick').addEventListener('input', (e) => {
        state.frame.thickness = parseInt(e.target.value);
        updateCanvas();
    });

    document.querySelectorAll('#frame-colors button').forEach(btn => {
        btn.addEventListener('click', (e) => {
            document.querySelectorAll('#frame-colors button').forEach(b => b.classList.add('border-transparent'));
            document.querySelectorAll('#frame-colors button').forEach(b => b.classList.remove('border-white', 'border-accent'));
            e.target.classList.remove('border-transparent');
            e.target.classList.add('border-accent');
            state.frame.color = e.target.dataset.color;
            updateCanvas();
        });
    });
    
    document.getElementById('custom-frame-color').addEventListener('input', (e) => {
        state.frame.color = e.target.value;
        updateCanvas();
    });

    // Text Settings
    document.getElementById('toggle-date').addEventListener('change', (e) => {
        state.text.showDate = e.target.checked;
        updateCanvas();
    });

    document.getElementById('toggle-location').addEventListener('change', (e) => {
        state.text.showLocation = e.target.checked;
        updateCanvas();
    });

    document.getElementById('btn-get-location').addEventListener('click', () => {
        const status = document.getElementById('location-status');
        status.innerText = "Mencari lokasi...";
        
        if ("geolocation" in navigator) {
            navigator.geolocation.getCurrentPosition(async (position) => {
                const lat = position.coords.latitude;
                const lon = position.coords.longitude;
                // Basic reverse geocoding via free public API (Nominatim) for demonstration
                // In a true 0-dependency offline app, this would just show coords.
                try {
                    const response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&zoom=10`);
                    const data = await response.json();
                    let locName = 'Lokasi Diketahui';
                    if(data.address) {
                        locName = data.address.city || data.address.town || data.address.village || data.address.county || 'Lokasi';
                    }
                    state.text.locationStr = locName;
                    status.innerText = `Lokasi disetel: ${locName}`;
                    document.getElementById('toggle-location').checked = true;
                    state.text.showLocation = true;
                    updateCanvas();
                } catch(err) {
                    state.text.locationStr = `${lat.toFixed(2)}, ${lon.toFixed(2)}`;
                    status.innerText = "Gagal mengambil nama kota. Menggunakan koordinat.";
                    updateCanvas();
                }
            }, () => {
                status.innerText = "Izin lokasi ditolak atau gagal.";
            });
        } else {
            status.innerText = "Geolokasi tidak didukung.";
        }
    });

    document.querySelectorAll('#text-colors button').forEach(btn => {
        btn.addEventListener('click', (e) => {
            document.querySelectorAll('#text-colors button').forEach(b => b.classList.remove('border-white', 'border-accent'));
            e.target.classList.add('border-accent');
            state.text.color = e.target.dataset.color;
            updateCanvas();
        });
    });

    // Watermark Settings
    document.getElementById('toggle-watermark').addEventListener('change', (e) => {
        state.watermark.show = e.target.checked;
        updateWatermarkUI();
    });

    document.getElementById('btn-upload-logo').addEventListener('click', () => {
        document.getElementById('logo-input').click();
    });

    document.getElementById('logo-input').addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => {
                    state.watermark.img = img;
                    document.getElementById('toggle-watermark').checked = true;
                    state.watermark.show = true;
                    updateWatermarkUI();
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        }
    });

    const opSlider = document.getElementById('slider-wm-opacity');
    opSlider.addEventListener('input', (e) => {
        state.watermark.opacity = parseInt(e.target.value) / 100;
        document.getElementById('wm-opacity-val').innerText = `${e.target.value}%`;
        updateWatermarkUI();
    });
    
    // Window resize handler to keep canvas fitting
    window.addEventListener('resize', () => {
        if(state.imageLoaded && state.mode === 'upload') {
            updateCanvas();
        }
    });

</script>
</body>
</html>
