<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Photo Style Collection</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'psc-black': '#121212',
                        'psc-white': '#f5f5f5',
                        'psc-yellow': '#FFD700',
                        'psc-gray': '#2a2a2a'
                    },
                    fontFamily: {
                        'typewriter': ['"Courier Prime"', 'monospace'],
                        'sans': ['Inter', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #121212;
            color: #f5f5f5;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
            touch-action: manipulation;
        }

        /* Hide scrollbar for clean UI but keep functionality */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        #editor-container {
            position: relative;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-image: 
                linear-gradient(45deg, #1a1a1a 25%, transparent 25%), 
                linear-gradient(-45deg, #1a1a1a 25%, transparent 25%), 
                linear-gradient(45deg, transparent 75%, #1a1a1a 75%), 
                linear-gradient(-45deg, transparent 75%, #1a1a1a 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
            min-height: 50vh;
            overflow: hidden; /* Ensure watermark doesn't overflow visually */
        }

        /* The actual canvas used for rendering and downloading */
        #main-canvas {
            max-width: 100%;
            max-height: 60vh;
            object-fit: contain;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            transition: all 0.3s ease;
        }

        /* Container for draggable watermark */
        #watermark-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* Let clicks pass through to canvas usually */
        }

        .watermark-element {
            position: absolute;
            pointer-events: auto; /* Make draggable */
            cursor: move;
            touch-action: none;
            user-select: none;
            max-width: 150px; /* Default max width */
            border: 1px dashed transparent;
        }
        
        .watermark-element:hover {
            border-color: #FFD700;
        }

        .filter-btn {
            transition: all 0.2s;
            border: 2px solid transparent;
        }
        .filter-btn.active {
            border-color: #FFD700;
            color: #FFD700;
            background-color: #2a2a2a;
        }
        
        .range-slider {
            -webkit-appearance: none;
            width: 100%;
            height: 4px;
            background: #4a4a4a;
            border-radius: 2px;
            outline: none;
        }
        
        .range-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #FFD700;
            cursor: pointer;
        }
        
        /* Camera UI overlays */
        #camera-ui {
            display: none;
        }
        video {
            object-fit: cover;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body class="flex flex-col h-screen">

    <header class="bg-psc-black p-4 flex justify-between items-center border-b border-psc-gray z-10 shrink-0">
        <h1 class="text-xl font-bold tracking-wider flex items-center gap-2">
            <span class="text-psc-white">PHOTO STYLE</span>
            <span class="text-psc-yellow">COLLECTION</span>
        </h1>
        <div class="flex gap-3">
            <button id="btn-camera" class="bg-psc-gray hover:bg-gray-700 text-white p-2 rounded-full transition" title="Buka Kamera">
                <i class="fas fa-camera"></i>
            </button>
            <label class="bg-psc-gray hover:bg-gray-700 text-white p-2 rounded-full cursor-pointer transition" title="Unggah Foto">
                <i class="fas fa-upload"></i>
                <input type="file" id="upload-image" accept="image/*" class="hidden">
            </label>
            <button id="btn-download" class="bg-psc-yellow hover:bg-yellow-500 text-black px-4 py-2 rounded font-bold transition flex items-center gap-2">
                <i class="fas fa-download"></i> Simpan
            </button>
        </div>
    </header>

    <main class="flex-grow flex flex-col relative overflow-hidden bg-psc-black">
        
        <!-- Editor View -->
        <div id="editor-view" class="flex-grow flex flex-col w-full h-full">
            <!-- Canvas Container -->
            <div id="editor-container" class="flex-grow p-4 relative">
                <div class="text-center text-gray-500 flex flex-col items-center justify-center absolute inset-0 z-0" id="placeholder-text">
                    <i class="fas fa-image text-4xl mb-2"></i>
                    <p>Unggah foto atau gunakan kamera untuk memulai</p>
                </div>
                <!-- The Canvas where everything is drawn -->
                <canvas id="main-canvas" class="z-10 relative"></canvas>
                
                <!-- Overlay for UI dragging (Watermark & Text) -->
                <div id="watermark-overlay" class="z-20">
                    <img id="draggable-watermark" src="LOGO SERRUM ART HANDLING PNG a.png" class="watermark-element hidden" alt="Watermark" draggable="false">
                    <div id="draggable-text" class="watermark-element hidden font-typewriter text-xl" style="color: black;" draggable="false"></div>
                </div>
            </div>

            <div class="bg-psc-black border-t border-psc-gray p-4 shrink-0 h-64 flex flex-col">
                <!-- Tool Categories Tabs -->
                <div class="flex overflow-x-auto no-scrollbar gap-2 mb-4 pb-2 border-b border-gray-800">
                    <button class="tab-btn px-4 py-2 rounded-full bg-psc-yellow text-black font-semibold text-sm whitespace-nowrap" data-target="panel-filters">Filters</button>
                    <button class="tab-btn px-4 py-2 rounded-full bg-psc-gray text-white text-sm whitespace-nowrap hover:text-psc-yellow transition" data-target="panel-frame">Polaroid Frame</button>
                    <button class="tab-btn px-4 py-2 rounded-full bg-psc-gray text-white text-sm whitespace-nowrap hover:text-psc-yellow transition" data-target="panel-text">Teks Mesin Ketik</button>
                    <button class="tab-btn px-4 py-2 rounded-full bg-psc-gray text-white text-sm whitespace-nowrap hover:text-psc-yellow transition" data-target="panel-watermark">Watermark</button>
                    <button class="tab-btn px-4 py-2 rounded-full bg-psc-gray text-white text-sm whitespace-nowrap hover:text-psc-yellow transition" data-target="panel-adjust">Sesuaikan</button>
                </div>

                <div id="panel-filters" class="tool-panel flex-grow flex flex-col overflow-hidden">
                    <div class="flex overflow-x-auto no-scrollbar gap-2 mb-2 pb-1">
                        <button class="filter-category-btn text-xs px-3 py-1 rounded bg-gray-800 text-psc-yellow border border-psc-yellow" data-category="pro">Auto Pro</button>
                        <button class="filter-category-btn text-xs px-3 py-1 rounded bg-gray-800 text-gray-400" data-category="retro">Retro</button>
                        <button class="filter-category-btn text-xs px-3 py-1 rounded bg-gray-800 text-gray-400" data-category="vintage">Vintage</button>
                        <button class="filter-category-btn text-xs px-3 py-1 rounded bg-gray-800 text-gray-400" data-category="cinematic">Cinematic</button>
                        <button class="filter-category-btn text-xs px-3 py-1 rounded bg-gray-800 text-gray-400" data-category="film">Film Style</button>
                        <button class="filter-category-btn text-xs px-3 py-1 rounded bg-gray-800 text-gray-400" data-category="cam-leica">Leica Style</button>
                        <button class="filter-category-btn text-xs px-3 py-1 rounded bg-gray-800 text-gray-400" data-category="cam-fuji">Fuji Style</button>
                        <button class="filter-category-btn text-xs px-3 py-1 rounded bg-gray-800 text-gray-400" data-category="cam-sony">Sony Style</button>
                    </div>
                    <div id="filter-container" class="flex overflow-x-auto no-scrollbar gap-3 pt-2 pb-2 h-full items-start">
                        <!-- Filters will be injected here via JS -->
                    </div>
                </div>

                <div id="panel-frame" class="tool-panel hidden flex-grow overflow-y-auto pr-2">
                    <div class="grid grid-cols-2 sm:grid-cols-3 gap-4 mb-4">
                        <button class="frame-btn filter-btn bg-gray-800 p-2 rounded flex flex-col items-center" data-frame="none">
                            <div class="w-12 h-16 border-2 border-gray-600 bg-gray-900 mb-1"></div>
                            <span class="text-xs">Tanpa Frame</span>
                        </button>
                        <button class="frame-btn filter-btn bg-gray-800 p-2 rounded flex flex-col items-center" data-frame="classic">
                            <div class="w-12 h-16 bg-white p-1 pb-3 mb-1 shadow-sm">
                                <div class="w-full h-full bg-gray-800"></div>
                            </div>
                            <span class="text-xs">Klasik Putih</span>
                        </button>
                        <button class="frame-btn filter-btn bg-gray-800 p-2 rounded flex flex-col items-center" data-frame="vintage">
                            <div class="w-12 h-16 bg-[#f4ebd0] p-1 pb-3 mb-1 shadow-sm">
                                <div class="w-full h-full bg-gray-800"></div>
                            </div>
                            <span class="text-xs">Vintage Kertas</span>
                        </button>
                        <button class="frame-btn filter-btn bg-gray-800 p-2 rounded flex flex-col items-center" data-frame="black">
                            <div class="w-12 h-16 bg-black p-1 pb-3 mb-1 shadow-sm border border-gray-700">
                                <div class="w-full h-full bg-gray-800"></div>
                            </div>
                            <span class="text-xs">Modern Hitam</span>
                        </button>
                        <button class="frame-btn filter-btn bg-gray-800 p-2 rounded flex flex-col items-center" data-frame="wide">
                            <div class="w-16 h-12 bg-white p-1 pr-4 mb-1 shadow-sm">
                                <div class="w-full h-full bg-gray-800"></div>
                            </div>
                            <span class="text-xs">Lanskap Lebar</span>
                        </button>
                        <button class="frame-btn filter-btn bg-gray-800 p-2 rounded flex flex-col items-center" data-frame="square">
                            <div class="w-12 h-12 bg-white p-1 pb-2 mb-1 shadow-sm">
                                <div class="w-full h-full bg-gray-800"></div>
                            </div>
                            <span class="text-xs">Insta Square</span>
                        </button>
                    </div>
                    
                    <div class="space-y-4">
                        <div>
                            <label class="text-xs text-gray-400 block mb-1">Ketebalan Frame</label>
                            <input type="range" id="frame-thickness" min="0.02" max="0.15" step="0.01" value="0.05" class="range-slider">
                        </div>
                        <div>
                            <label class="text-xs text-gray-400 block mb-1">Warna Frame</label>
                            <input type="color" id="frame-color" value="#ffffff" class="w-full h-8 rounded cursor-pointer bg-transparent border-0 p-0">
                        </div>
                    </div>
                </div>

                <div id="panel-text" class="tool-panel hidden flex-grow overflow-y-auto pr-2">
                    <div class="space-y-4">
                        <div class="flex items-center gap-2 mb-2">
                            <input type="checkbox" id="toggle-text" class="w-4 h-4 text-psc-yellow bg-gray-800 border-gray-600 rounded focus:ring-psc-yellow">
                            <label for="toggle-text" class="text-sm">Tampilkan Teks Info</label>
                        </div>
                        
                        <div id="text-controls" class="opacity-50 pointer-events-none transition-opacity">
                            <div class="grid grid-cols-2 gap-2 mb-3">
                                <div>
                                    <label class="text-xs text-gray-400 block mb-1">Lokasi</label>
                                    <input type="text" id="text-location" value="JAKARTA" class="w-full bg-gray-800 border border-gray-700 rounded p-1 text-sm font-typewriter uppercase">
                                </div>
                                <div>
                                    <label class="text-xs text-gray-400 block mb-1">Tanggal/Tahun</label>
                                    <input type="text" id="text-date" value="20 SEP '26" class="w-full bg-gray-800 border border-gray-700 rounded p-1 text-sm font-typewriter uppercase">
                                </div>
                            </div>
                            <div class="grid grid-cols-2 gap-4">
                                <div>
                                    <label class="text-xs text-gray-400 block mb-1">Ukuran Font</label>
                                    <input type="range" id="text-size" min="10" max="60" value="24" class="range-slider">
                                </div>
                                <div>
                                    <label class="text-xs text-gray-400 block mb-1">Warna Font</label>
                                    <input type="color" id="text-color" value="#000000" class="w-full h-8 rounded cursor-pointer bg-transparent border-0 p-0">
                                </div>
                            </div>
                            <p class="text-xs text-gray-500 mt-2 italic"><i class="fas fa-hand-pointer mr-1"></i> Sentuh dan seret teks pada foto untuk memindahkannya.</p>
                        </div>
                    </div>
                </div>

                <div id="panel-watermark" class="tool-panel hidden flex-grow overflow-y-auto pr-2">
                    <div class="space-y-4">
                        <div class="flex items-center gap-2 mb-2">
                            <input type="checkbox" id="toggle-watermark" checked class="w-4 h-4 text-psc-yellow bg-gray-800 border-gray-600 rounded focus:ring-psc-yellow">
                            <label for="toggle-watermark" class="text-sm">Tampilkan Watermark</label>
                        </div>

                        <div id="watermark-controls" class="space-y-4">
                            <div>
                                <label class="bg-gray-800 hover:bg-gray-700 text-white text-sm py-2 px-4 rounded cursor-pointer transition inline-block border border-gray-600">
                                    <i class="fas fa-upload mr-2"></i>Ganti Logo Watermark
                                    <input type="file" id="upload-watermark" accept="image/png, image/jpeg, image/svg+xml" class="hidden">
                                </label>
                            </div>
                            
                            <div>
                                <label class="text-xs text-gray-400 block mb-1">Ukuran (Skala)</label>
                                <input type="range" id="watermark-size" min="0.05" max="0.5" step="0.01" value="0.15" class="range-slider">
                            </div>
                            
                            <div>
                                <label class="text-xs text-gray-400 block mb-1">Transparansi (Opacity)</label>
                                <input type="range" id="watermark-opacity" min="0.1" max="1" step="0.05" value="0.8" class="range-slider">
                            </div>
                            <p class="text-xs text-gray-500 mt-1 italic"><i class="fas fa-hand-pointer mr-1"></i> Sentuh dan seret logo pada foto untuk memindahkannya.</p>
                        </div>
                    </div>
                </div>

                <div id="panel-adjust" class="tool-panel hidden flex-grow overflow-y-auto pr-2">
                    <div class="space-y-4">
                        <div>
                            <div class="flex justify-between text-xs mb-1">
                                <span class="text-gray-400">Exposure (Kecerahan)</span>
                                <span id="val-exposure" class="text-psc-yellow">0</span>
                            </div>
                            <input type="range" id="adj-exposure" min="-100" max="100" value="0" class="range-slider" data-val-id="val-exposure">
                        </div>
                        <div>
                            <div class="flex justify-between text-xs mb-1">
                                <span class="text-gray-400">Kontras</span>
                                <span id="val-contrast" class="text-psc-yellow">0</span>
                            </div>
                            <input type="range" id="adj-contrast" min="-100" max="100" value="0" class="range-slider" data-val-id="val-contrast">
                        </div>
                        <div>
                            <div class="flex justify-between text-xs mb-1">
                                <span class="text-gray-400">Saturasi</span>
                                <span id="val-saturation" class="text-psc-yellow">0</span>
                            </div>
                            <input type="range" id="adj-saturation" min="-100" max="100" value="0" class="range-slider" data-val-id="val-saturation">
                        </div>
                        <button id="btn-reset-adjust" class="w-full py-1 text-sm bg-gray-800 hover:bg-gray-700 text-white rounded border border-gray-600 transition mt-2">Reset Penyesuaian</button>
                    </div>
                </div>

            </div>
        </div>

        <div id="camera-ui" class="absolute inset-0 z-50 bg-black flex-col">
            <div class="relative flex-grow w-full h-full flex items-center justify-center overflow-hidden bg-black">
                <!-- Video feed (no crop, object-fit: contain to see full sensor if preferred, but usually cover is expected for full screen. User asked for no crop, so we use contain for the actual video element, but we'll capture the raw intrinsic size) -->
                <video id="camera-feed" autoplay playsinline style="object-fit: contain;"></video>
                
                <!-- Camera Controls Overlay -->
                <div class="absolute inset-0 flex flex-col justify-between p-4 pointer-events-none">
                    <!-- Top Bar -->
                    <div class="flex justify-between items-start pointer-events-auto">
                        <button id="btn-close-camera" class="bg-black/50 text-white p-3 rounded-full backdrop-blur-sm">
                            <i class="fas fa-times text-xl"></i>
                        </button>
                        <div class="flex gap-2">
                            <button id="btn-switch-camera" class="bg-black/50 text-white p-3 rounded-full backdrop-blur-sm">
                                <i class="fas fa-sync-alt text-xl"></i>
                            </button>
                        </div>
                    </div>
                    
                    <!-- Middle Area for Exposure Slider (Vertical on right) -->
                    <div class="absolute right-4 top-1/2 -translate-y-1/2 pointer-events-auto h-1/2 flex items-center">
                        <input type="range" id="camera-exposure" min="-2" max="2" step="0.1" value="0" style="writing-mode: vertical-lr; direction: rtl; appearance: slider-vertical;" class="h-full w-8 cursor-pointer opacity-70">
                    </div>

                    <!-- Bottom Bar -->
                    <div class="flex flex-col items-center gap-4 pointer-events-auto mb-4">
                        <!-- Lens selection -->
                        <div class="flex bg-black/60 rounded-full p-1 backdrop-blur-sm">
                            <button class="lens-btn w-10 h-10 rounded-full text-xs font-bold text-white transition active-lens" data-zoom="1">1x</button>
                            <button class="lens-btn w-10 h-10 rounded-full text-xs font-bold text-gray-400 transition" data-zoom="2">2x</button>
                            <button class="lens-btn w-10 h-10 rounded-full text-xs font-bold text-gray-400 transition" data-zoom="3">3x</button>
                        </div>
                        
                        <!-- Capture Button -->
                        <button id="btn-capture" class="w-20 h-20 rounded-full border-4 border-white p-1">
                            <div class="w-full h-full bg-white rounded-full active:bg-gray-300 transition-colors"></div>
                        </button>
                    </div>
                </div>
            </div>
        </div>

    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // State Variables
            const state = {
                imageLoaded: false,
                originalImage: null, // HTMLImageElement
                currentFilter: 'none',
                filterIntensity: 100, // For future use
                frame: {
                    type: 'none',
                    thickness: 0.05, // % of image shortest side
                    color: '#ffffff'
                },
                text: {
                    visible: false,
                    content: '',
                    x: 0.5, // relative to image width
                    y: 0.9, // relative to image height
                    size: 24, // base size, will scale
                    color: '#000000'
                },
                watermark: {
                    visible: true,
                    img: new Image(),
                    x: 0.8,
                    y: 0.8,
                    scale: 0.15,
                    opacity: 0.8,
                    loaded: false
                },
                adjustments: {
                    brightness: 100, // 100 is normal (CSS filter based) -> Mapped to Exposure
                    contrast: 100,
                    saturate: 100
                },
                camera: {
                    stream: null,
                    videoTrack: null,
                    capabilities: null,
                    facingMode: 'environment', // Start with back camera
                    zoom: 1,
                    exposure: 0
                }
            };

            // DOM Elements
            const canvas = document.getElementById('main-canvas');
            const ctx = canvas.getContext('2d', { willReadFrequently: true }); // optimize for frequent reads during filter application if needed
            const uploadInput = document.getElementById('upload-image');
            const downloadBtn = document.getElementById('btn-download');
            const placeholder = document.getElementById('placeholder-text');
            const container = document.getElementById('editor-container');
            
            // Drag elements
            const overlay = document.getElementById('watermark-overlay');
            const dragWm = document.getElementById('draggable-watermark');
            const dragText = document.getElementById('draggable-text');

            // Defining 10 filters per category as requested
            const filters = {
                'pro': [
                    { id: 'pro-auto', name: 'Auto Enhance', css: 'contrast(110%) saturate(120%) brightness(105%)' },
                    { id: 'pro-hdr', name: 'HDR Balance', css: 'contrast(115%) saturate(110%) drop-shadow(0 0 5px rgba(255,255,255,0.1))' }, // Simulating HDR slightly
                    { id: 'pro-portrait', name: 'Soft Portrait', css: 'contrast(95%) saturate(105%) brightness(110%) sepia(5%)' },
                    { id: 'pro-landscape', name: 'Vivid Nature', css: 'contrast(120%) saturate(140%) brightness(102%)' },
                    { id: 'pro-night', name: 'Night Sight', css: 'brightness(130%) contrast(110%) saturate(90%)' },
                    { id: 'pro-food', name: 'Food Pop', css: 'saturate(150%) contrast(110%) hue-rotate(5deg)' },
                    { id: 'pro-bw', name: 'Pro B&W', css: 'grayscale(100%) contrast(130%) brightness(95%)' },
                    { id: 'pro-clean', name: 'Clean White', css: 'brightness(115%) contrast(105%) saturate(95%)' },
                    { id: 'pro-warm', name: 'Golden Hour', css: 'sepia(30%) saturate(120%) contrast(105%) brightness(105%)' },
                    { id: 'pro-cool', name: 'Blue Hour', css: 'hue-rotate(-15deg) saturate(110%) brightness(105%) contrast(110%)' }
                ],
                'retro': [
                    { id: 'retro-1', name: '80s Arcade', css: 'contrast(140%) saturate(200%) hue-rotate(15deg) brightness(90%)' },
                    { id: 'retro-2', name: 'Polaroid 600', css: 'sepia(20%) contrast(110%) saturate(80%) brightness(110%)' },
                    { id: 'retro-3', name: 'Faded Print', css: 'contrast(80%) brightness(120%) sepia(30%) saturate(60%)' },
                    { id: 'retro-4', name: 'Lomo', css: 'contrast(150%) saturate(130%) sepia(20%)' }, // Vignette handled in render
                    { id: 'retro-5', name: 'Toy Camera', css: 'saturate(150%) contrast(120%) blur(0.5px)' },
                    { id: 'retro-6', name: 'VHS', css: 'contrast(90%) saturate(150%) hue-rotate(-20deg) blur(0.5px)' },
                    { id: 'retro-7', name: 'Disco', css: 'saturate(200%) hue-rotate(45deg) contrast(110%)' },
                    { id: 'retro-8', name: 'Sepia Tone', css: 'sepia(100%) contrast(110%) brightness(90%)' },
                    { id: 'retro-9', name: 'Instant Warm', css: 'sepia(40%) saturate(120%) brightness(110%) contrast(105%)' },
                    { id: 'retro-10', name: 'Washed Out', css: 'contrast(70%) brightness(130%) saturate(40%)' }
                ],
                'vintage': [
                    { id: 'vint-1', name: '1970s', css: 'sepia(50%) contrast(90%) brightness(110%) saturate(80%)' },
                    { id: 'vint-2', name: 'Old Newspaper', css: 'grayscale(100%) contrast(150%) brightness(110%) sepia(20%)' },
                    { id: 'vint-3', name: 'Tintype', css: 'sepia(80%) contrast(130%) brightness(80%) grayscale(50%)' },
                    { id: 'vint-4', name: 'Kodachrome', css: 'saturate(130%) contrast(120%) sepia(10%)' },

            // Helper to generate CSS filter string based on all settings
            function getCombinedFilterCSS() {
                let css = '';
                
                // 1. Manual Adjustments (Exposure, Contrast, Saturation)
                // Map exposure (-100 to 100) to brightness (0.5 to 1.5)
                const brightnessVal = 1 + (state.adjustments.brightness - 100) / 200;
                const contrastVal = state.adjustments.contrast / 100;
                const saturateVal = state.adjustments.saturate / 100;
                
                css += `brightness(${brightnessVal}) contrast(${contrastVal}) saturate(${saturateVal}) `;

                // 2. Selected Filter Preset
                if (state.currentFilter !== 'none') {
                    // Find the filter definition
                    for (const category in filters) {
                        const filterDef = filters[category].find(f => f.id === state.currentFilter);
                        if (filterDef) {
                            css += filterDef.css + ' ';
                            break;
                        }
                    }
                }
                
                return css.trim();
            }

            
            // Load Initial Watermark Image
            state.watermark.img.onload = () => {
                state.watermark.loaded = true;
                dragWm.src = state.watermark.img.src;
                render();

            // The main render function that draws to canvas
            function render() {
                if (!state.imageLoaded || !state.originalImage) return;

                // 1. Calculate Canvas Dimensions based on original image + Frame
                let imgWidth = state.originalImage.width;
                let imgHeight = state.originalImage.height;
                let frameThicknessPx = 0;
                let bottomFrameExtraPx = 0;

                if (state.frame.type !== 'none') {
                    // Frame thickness relative to shortest side
                    const shortestSide = Math.min(imgWidth, imgHeight);
                    frameThicknessPx = Math.floor(shortestSide * state.frame.thickness);
                    
                    if (state.frame.type === 'classic' || state.frame.type === 'vintage' || state.frame.type === 'black') {
                        bottomFrameExtraPx = frameThicknessPx * 3; // Thicker bottom for polaroid look
                    } else if (state.frame.type === 'wide') {
                        // Just regular thick border all around for wide
                        bottomFrameExtraPx = 0; 
                    } else if (state.frame.type === 'square') {
                         // Force square aspect ratio canvas
                         const maxSide = Math.max(imgWidth, imgHeight);
                         imgWidth = maxSide;
                         imgHeight = maxSide;
                    }
                }

                canvas.width = imgWidth + (frameThicknessPx * 2);
                canvas.height = imgHeight + frameThicknessPx + (frameThicknessPx + bottomFrameExtraPx);

                // Clear canvas
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                // 2. Draw Frame Background
                if (state.frame.type !== 'none') {
                    let frameColor = state.frame.color;
                    if (state.frame.type === 'vintage') frameColor = '#f4ebd0'; // Override with vintage color if selected, ignoring picker
                    if (state.frame.type === 'black') frameColor = '#111111';
                    
                    ctx.fillStyle = frameColor;
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    
                    // Add slight inner shadow for vintage/black frames
                    if (state.frame.type === 'vintage' || state.frame.type === 'black' || state.frame.type === 'classic') {
                        ctx.strokeStyle = 'rgba(0,0,0,0.1)';
                        ctx.lineWidth = 2;
                        ctx.strokeRect(1, 1, canvas.width - 2, canvas.height - 2);
                    }
                }

                // 3. Draw Image with CSS Filters applied via Canvas context filter
                ctx.save();
                
                // Calculate position to draw image (centered if frame is square, else offset by frame thickness)
                let drawX = frameThicknessPx;
                let drawY = frameThicknessPx;
                let drawW = state.originalImage.width;
                let drawH = state.originalImage.height;

                if (state.frame.type === 'square') {
                    // Center the image in the square frame
                    drawX = frameThicknessPx + (imgWidth - state.originalImage.width) / 2;
                    drawY = frameThicknessPx + (imgHeight - state.originalImage.height) / 2;
                }

                // Apply Auto Pro enhancement logic if selected
                // (Note: Real "auto enhance" requires complex pixel analysis. 
                // We simulate it here by tweaking contrast/brightness slightly based on a generic approach, 
                // but mostly relying on the CSS filters defined above for the look).
                
                ctx.filter = getCombinedFilterCSS();
                ctx.drawImage(state.originalImage, drawX, drawY, drawW, drawH);
                ctx.restore();

                // Lomo Vignette effect (if lomo filter active)
                if (state.currentFilter === 'retro-4') {
                    const gradient = ctx.createRadialGradient(
                        canvas.width/2, canvas.height/2, 0,
                        canvas.width/2, canvas.height/2, Math.max(canvas.width, canvas.height)/1.5
                    );
                    gradient.addColorStop(0, 'rgba(0,0,0,0)');
                    gradient.addColorStop(1, 'rgba(0,0,0,0.8)');
                    ctx.fillStyle = gradient;
                    ctx.fillRect(drawX, drawY, drawW, drawH); // Apply only over image, not frame
                }

                // Update UI overlay positions to match canvas scaling
                updateOverlays();
            }

            
            // Sync overlay elements with state for drag & drop visual
            function updateOverlays() {
                if (!state.imageLoaded) return;

                // Sync text
                if (state.text.visible) {
                    dragText.classList.remove('hidden');
                    // Format text
                    const dateStr = document.getElementById('text-date').value;
                    const locStr = document.getElementById('text-location').value;
                    dragText.innerHTML = `${locStr}<br>${dateStr}`;
                    dragText.style.color = state.text.color;
                    
                    // We don't set absolute pixel size here because the canvas scales in CSS.
                    // We set a base em/rem and let the user visually drag it.
                    // The actual rendering size on download will be calculated relative to canvas width.
                    // For preview, map slider (10-60) to a reasonable rem size
                    const previewSize = (state.text.size / 30) + 0.5; // roughly 0.8rem to 2.5rem
                    dragText.style.fontSize = `${previewSize}rem`;
                    
                } else {
                    dragText.classList.add('hidden');
                }

                // Sync Watermark
                if (state.watermark.visible && state.watermark.loaded) {
                    dragWm.classList.remove('hidden');
                    dragWm.style.opacity = state.watermark.opacity;
                    
                    // Base size on visual container width for preview
                    const containerWidth = container.clientWidth;
                    const displayWidth = containerWidth * state.watermark.scale;
                    dragWm.style.width = `${displayWidth}px`;
                    
                } else {
                    dragWm.classList.add('hidden');
                }
            }

            // Dragging Logic for Overlays
            let activeDragElement = null;
            let dragOffsetX = 0, dragOffsetY = 0;

            function startDrag(e, type) {
                if(e.type === 'touchstart') e.preventDefault(); // Prevent scrolling while dragging
                
                activeDragElement = type;
                const el = type === 'watermark' ? dragWm : dragText;
                
                let clientX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
                let clientY = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;
                
                const rect = el.getBoundingClientRect();
                dragOffsetX = clientX - rect.left;
                dragOffsetY = clientY - rect.top;
            }

            function doDrag(e) {
                if (!activeDragElement) return;
                
                let clientX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
                let clientY = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;
                
                const el = activeDragElement === 'watermark' ? dragWm : dragText;
                const overlayRect = overlay.getBoundingClientRect();
                
                let newX = clientX - dragOffsetX - overlayRect.left;
                let newY = clientY - dragOffsetY - overlayRect.top;
                
                // Constrain to overlay bounds roughly
                newX = Math.max(0, Math.min(newX, overlayRect.width - el.offsetWidth));
                newY = Math.max(0, Math.min(newY, overlayRect.height - el.offsetHeight));
                
                el.style.left = `${newX}px`;
                el.style.top = `${newY}px`;
                
                // Update state relative positions (0 to 1) based on visual overlay
                if (activeDragElement === 'watermark') {
                    state.watermark.x = newX / overlayRect.width;
                    state.watermark.y = newY / overlayRect.height;
                } else {
                    state.text.x = newX / overlayRect.width;
                    state.text.y = newY / overlayRect.height;
                }
            }

            function stopDrag() {
                activeDragElement = null;
            }

            // Mouse Events
            dragWm.addEventListener('mousedown', (e) => startDrag(e, 'watermark'));
            dragText.addEventListener('mousedown', (e) => startDrag(e, 'text'));
            document.addEventListener('mousemove', doDrag);
            document.addEventListener('mouseup', stopDrag);

            // Touch Events
            dragWm.addEventListener('touchstart', (e) => startDrag(e, 'watermark'), {passive: false});
            dragText.addEventListener('touchstart', (e) => startDrag(e, 'text'), {passive: false});
            document.addEventListener('touchmove', doDrag, {passive: false});
            document.addEventListener('touchend', stopDrag);

            // Initial positioning
            dragWm.style.left = `${state.watermark.x * 100}%`;
            dragWm.style.top = `${state.watermark.y * 100}%`;
            dragText.style.left = `${state.text.x * 100}%`;
            dragText.style.top = `${state.text.y * 100}%`;

            document.querySelectorAll('.frame-btn').forEach(btn => {

                    textControls.classList.add('opacity-50', 'pointer-events-none');
                }
                updateOverlays();
            });

            ['text-location', 'text-date'].forEach(id => {
                document.getElementById(id).addEventListener('input', updateOverlays);
            });
            
            document.getElementById('text-size').addEventListener('input', (e) => {
                state.text.size = parseInt(e.target.value);
                updateOverlays();
            });
            document.getElementById('text-color').addEventListener('input', (e) => {

            // Watermark Controls
            const toggleWmBtn = document.getElementById('toggle-watermark');
            const wmControls = document.getElementById('watermark-controls');
            
            toggleWmBtn.addEventListener('change', (e) => {
                state.watermark.visible = e.target.checked;

            // Adjustment Controls
            function resetAdjustments() {
                state.adjustments = { brightness: 100, contrast: 100, saturate: 100 };
                document.getElementById('adj-exposure').value = 0;
                document.getElementById('val-exposure').innerText = '0';
                document.getElementById('adj-contrast').value = 0;
                document.getElementById('val-contrast').innerText = '0';
                document.getElementById('adj-saturation').value = 0;
                document.getElementById('val-saturation').innerText = '0';
            }

            document.getElementById('btn-reset-adjust').addEventListener('click', () => {
                resetAdjustments();
                render();
            });

            ['exposure', 'contrast', 'saturation'].forEach(type => {
                const input = document.getElementById(`adj-${type}`);
                input.addEventListener('input', (e) => {
                    const val = parseInt(e.target.value);
                    document.getElementById(e.target.getAttribute('data-val-id')).innerText = val > 0 ? `+${val}` : val;
                    
                    if (type === 'exposure') state.adjustments.brightness = 100 + val;
                    if (type === 'contrast') state.adjustments.contrast = 100 + val;
                    if (type === 'saturation') state.adjustments.saturate = 100 + val;
                    
                    render();
                });
            });

            downloadBtn.addEventListener('click', () => {
                if (!state.imageLoaded) {
                    alert('Silakan unggah atau ambil foto terlebih dahulu.');
                    return;
                }

                // 1. Create a temporary high-res canvas
                const exportCanvas = document.createElement('canvas');
                const exportCtx = exportCanvas.getContext('2d');
                
                // Set dimensions exactly to main canvas dimensions (which are based on original image + frame)
                exportCanvas.width = canvas.width;
                exportCanvas.height = canvas.height;
                
                // 2. Redraw everything exactly as render() does, but onto exportCanvas
                // Draw Frame
                if (state.frame.type !== 'none') {
                    let frameColor = state.frame.color;
                    if (state.frame.type === 'vintage') frameColor = '#f4ebd0';
                    if (state.frame.type === 'black') frameColor = '#111111';
                    
                    exportCtx.fillStyle = frameColor;
                    exportCtx.fillRect(0, 0, exportCanvas.width, exportCanvas.height);
                    
                    if (state.frame.type === 'vintage' || state.frame.type === 'black' || state.frame.type === 'classic') {
                        exportCtx.strokeStyle = 'rgba(0,0,0,0.1)';
                        exportCtx.lineWidth = Math.max(2, exportCanvas.width * 0.002);
                        exportCtx.strokeRect(1, 1, exportCanvas.width - 2, exportCanvas.height - 2);
                    }
                }

                // Calculate image drawing area
                const shortestSide = Math.min(state.originalImage.width, state.originalImage.height);
                const frameThicknessPx = state.frame.type !== 'none' ? Math.floor(shortestSide * state.frame.thickness) : 0;
                
                let drawX = frameThicknessPx;
                let drawY = frameThicknessPx;
                
                if (state.frame.type === 'square') {
                    drawX = frameThicknessPx + (exportCanvas.width - (frameThicknessPx*2) - state.originalImage.width) / 2;
                    drawY = frameThicknessPx + (exportCanvas.height - (frameThicknessPx*2) - state.originalImage.height) / 2;
                }

                exportCtx.save();
                exportCtx.filter = getCombinedFilterCSS();
                exportCtx.drawImage(state.originalImage, drawX, drawY, state.originalImage.width, state.originalImage.height);
                exportCtx.restore();

                if (state.currentFilter === 'retro-4') {
                    const gradient = exportCtx.createRadialGradient(
                        exportCanvas.width/2, exportCanvas.height/2, 0,
                        exportCanvas.width/2, exportCanvas.height/2, Math.max(exportCanvas.width, exportCanvas.height)/1.5
                    );
                    gradient.addColorStop(0, 'rgba(0,0,0,0)');
                    gradient.addColorStop(1, 'rgba(0,0,0,0.8)');
                    exportCtx.fillStyle = gradient;
                    exportCtx.fillRect(drawX, drawY, state.originalImage.width, state.originalImage.height);
                }

                // 3. Draw Watermark onto export canvas
                if (state.watermark.visible && state.watermark.loaded) {
                    exportCtx.save();
                    exportCtx.globalAlpha = state.watermark.opacity;
                    
                    // Calculate size relative to canvas width
                    const wmWidth = exportCanvas.width * state.watermark.scale;
                    const aspect = state.watermark.img.height / state.watermark.img.width;
                    const wmHeight = wmWidth * aspect;
                    
                    // The stored x/y are percentages of the visual overlay. 
                    // Map them to the export canvas coordinates.
                    // Note: This mapping is an approximation because visual overlay aspect ratio 
                    // might differ slightly from canvas aspect ratio depending on CSS layout,
                    // but it usually works well enough for drag & drop watermarks.
                    const finalX = state.watermark.x * exportCanvas.width;
                    const finalY = state.watermark.y * exportCanvas.height;
                    
                    exportCtx.drawImage(state.watermark.img, finalX, finalY, wmWidth, wmHeight);
                    exportCtx.restore();
                }

                // 4. Draw Text onto export canvas
                if (state.text.visible) {
                    const dateStr = document.getElementById('text-date').value;
                    const locStr = document.getElementById('text-location').value;
                    
                    exportCtx.save();
                    exportCtx.fillStyle = state.text.color;
                    
                    // Scale font size based on canvas width (base 24 slider roughly equals 3% of width)
                    const fontSizePx = exportCanvas.width * (state.text.size / 1000); 
                    exportCtx.font = `${fontSizePx}px "Courier Prime", monospace`;
                    exportCtx.textBaseline = 'top';
                    
                    const finalX = state.text.x * exportCanvas.width;
                    const finalY = state.text.y * exportCanvas.height;
                    
                    // Draw multiline text
                    exportCtx.fillText(locStr, finalX, finalY);
                    exportCtx.fillText(dateStr, finalX, finalY + (fontSizePx * 1.2)); // Line height
                    
                    exportCtx.restore();
                }

                // 5. Trigger Download
                const link = document.createElement('a');
                link.download = `PhotoStyle_${Date.now()}.png`;
                link.href = exportCanvas.toDataURL('image/png', 1.0); // High quality PNG
                link.click();
            });

            const videoEl = document.getElementById('camera-feed');
            const cameraUi = document.getElementById('camera-ui');
            const btnCamera = document.getElementById('btn-camera');
            const btnCloseCamera = document.getElementById('btn-close-camera');
            const btnSwitchCamera = document.getElementById('btn-switch-camera');
            const btnCapture = document.getElementById('btn-capture');
            const lensBtns = document.querySelectorAll('.lens-btn');
            const exposureSlider = document.getElementById('camera-exposure');

            async function openCamera() {
                if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                    try {
                        const constraints = {
                            video: {
                                facingMode: state.camera.facingMode,
                                // Request high resolution, let browser figure out the aspect ratio, we handle it via object-fit
                                width: { ideal: 4096 },
                                height: { ideal: 2160 },
                                zoom: true // Request zoom capability if available
                            }
                        };
                        
                        const stream = await navigator.mediaDevices.getUserMedia(constraints);
                        state.camera.stream = stream;
                        videoEl.srcObject = stream;
                        
                        // Get video track for advanced controls (zoom, exposure)
                        state.camera.videoTrack = stream.getVideoTracks()[0];
                        state.camera.capabilities = state.camera.videoTrack.getCapabilities();
                        
                        cameraUi.style.display = 'flex';
                        
                        // Setup Lens (Zoom) buttons if supported
                        if (state.camera.capabilities && state.camera.capabilities.zoom) {
                            lensBtns.forEach(btn => btn.style.display = 'block');
                            // Reset to 1x visually
                            setLens(1);
                        } else {
                            // Hide lens buttons if zoom not supported natively
                            lensBtns.forEach(btn => btn.style.display = 'none');
                        }

                        // Setup Exposure compensation if supported
                        if (state.camera.capabilities && state.camera.capabilities.exposureCompensation) {
                            exposureSlider.style.display = 'block';
                            exposureSlider.min = state.camera.capabilities.exposureCompensation.min;
                            exposureSlider.max = state.camera.capabilities.exposureCompensation.max;
                            exposureSlider.step = state.camera.capabilities.exposureCompensation.step || 0.1;
                            exposureSlider.value = state.camera.videoTrack.getSettings().exposureCompensation || 0;
                        } else {
                            exposureSlider.style.display = 'none';
                        }

                    } catch (err) {
                        console.error("Error accessing camera: ", err);
                        alert("Tidak dapat mengakses kamera. Pastikan izin telah diberikan.");
                    }
                } else {
                    alert("Browser Anda tidak mendukung fitur kamera.");
                }
            }

            function closeCamera() {
                if (state.camera.stream) {
                    state.camera.stream.getTracks().forEach(track => track.stop());
                }
                cameraUi.style.display = 'none';
            }

            btnCamera.addEventListener('click', openCamera);
            btnCloseCamera.addEventListener('click', closeCamera);
            
            btnSwitchCamera.addEventListener('click', () => {
                state.camera.facingMode = state.camera.facingMode === 'user' ? 'environment' : 'user';
                closeCamera();
                setTimeout(openCamera, 300); // Small delay to ensure hardware is released
            });

            // Exposure control listener
            exposureSlider.addEventListener('input', (e) => {
                if (state.camera.videoTrack && state.camera.capabilities && state.camera.capabilities.exposureCompensation) {
                    try {
                        state.camera.videoTrack.applyConstraints({
                            advanced: [{ exposureCompensation: parseFloat(e.target.value) }]
                        });
                    } catch (err) {
                        console.error("Exposure change not supported:", err);
                    }
                }
            });

            // Lens (Zoom) control listener
            function setLens(zoomLevel) {
                if (state.camera.videoTrack && state.camera.capabilities && state.camera.capabilities.zoom) {
                    try {
                        // Map 1x, 2x, 3x to device's zoom range. 
                        // Realistically, many webcams don't support true optical zoom via web API, 
                        // but mobile browsers might expose it for multi-lens setups.
                        const minZoom = state.camera.capabilities.zoom.min || 1;
                        const maxZoom = state.camera.capabilities.zoom.max || 3;
                        
                        // Simple mapping: 1x = min, 3x = max, 2x = middle (or just direct value if supported)
                        let targetZoom = zoomLevel;
                        // Clamp to capabilities
                        targetZoom = Math.max(minZoom, Math.min(targetZoom, maxZoom));

                        state.camera.videoTrack.applyConstraints({
                            advanced: [{ zoom: targetZoom }]
                        });
                        
                        // Update UI
                        lensBtns.forEach(b => {
                            b.classList.remove('text-white', 'active-lens');
                            b.classList.add('text-gray-400');
                        });
                        const activeBtn = document.querySelector(`.lens-btn[data-zoom="${zoomLevel}"]`);
                        if(activeBtn) {
                            activeBtn.classList.remove('text-gray-400');
                            activeBtn.classList.add('text-white', 'active-lens');
                        }

                    } catch (err) {
                        console.error("Zoom not supported:", err);
                    }
                }
            }

            lensBtns.forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const zoom = parseFloat(e.target.getAttribute('data-zoom'));
                    setLens(zoom);
                });
            });

            // Capture photo
            btnCapture.addEventListener('click', () => {
                if (!videoEl.videoWidth) return;

                // Create a temporary canvas to capture the raw video frame
                const capCanvas = document.createElement('canvas');
                capCanvas.width = videoEl.videoWidth;
                capCanvas.height = videoEl.videoHeight;
                const capCtx = capCanvas.getContext('2d');
                
                // Draw current frame. No cropping, raw feed.
                capCtx.drawImage(videoEl, 0, 0, capCanvas.width, capCanvas.height);
                
                // Convert to Image to feed into our standard rendering pipeline
                const img = new Image();
                img.onload = () => {
                    state.originalImage = img;
                    state.imageLoaded = true;
                    placeholder.style.display = 'none';
                    resetAdjustments();
                    closeCamera();
                    
                    // Re-render filters for preview
                    const activeCatBtn = document.querySelector('.filter-category-btn.text-psc-yellow');
                    if(activeCatBtn) renderFilterCategory(activeCatBtn.getAttribute('data-category'));
                    
                    render();
                };
                img.src = capCanvas.toDataURL('image/jpeg', 1.0); // High quality capture
                
                // Visual feedback for capture
                btnCapture.querySelector('div').style.backgroundColor = '#999';
                setTimeout(() => {
                    btnCapture.querySelector('div').style.backgroundColor = '#fff';
                }, 100);
            });

            // Handle Window Resize to keep canvas responsive
            window.addEventListener('resize', () => {
                if(state.imageLoaded) {
                    // Re-calculate overlays relative to new container size
                    updateOverlays();
                }
            });

        });
    </script>
</body>
</html>
